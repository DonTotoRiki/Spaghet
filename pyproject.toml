[project]
name = "spaghet"
version = "0.1.0"
description = "Cartographie visuelle du réseau local"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "scapy",
    "zeroconf",
    "manuf",
    "maxminddb",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spaghet"]
