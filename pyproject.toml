[project]
name = "spaghet"
version = "0.1.0"
description = "Cartographie visuelle du réseau local"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "numpy",
    "scapy",
    "zeroconf",
    "manuf",
    "maxminddb",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spaghet"]
