<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spaghet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span>Spaghet <span id="status"></span></span>
    <nav role="tablist">
      <button role="tab" id="tab-graph" aria-selected="true">Graphe</button>
      <button role="tab" id="tab-map" aria-selected="false">Carte</button>
    </nav>
    <span class="actions">
      <label><input type="checkbox" id="show-internet" checked> Internet</label>
      <button id="export-png" title="Image du graphe complet">PNG</button>
      <button id="export-json" title="État complet du réseau">JSON</button>
    </span>
  </header>
  <main id="graph"></main>
  <main id="map" hidden></main>
  <aside id="legend" aria-label="Protocoles : cliquer pour masquer ou afficher"></aside>
  <aside id="panel" hidden></aside>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
